name: Simulator GPS diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  control:
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        ios: ['18.5']
        distance_filter: ['10', '-1']
    steps:
      - uses: actions/checkout@v4
      - name: Prepare runtime
        run: python3 Scripts/prepare_simulator_runtime.py '${{ matrix.ios }}'
      - name: Check GPS delivery to a minimal foreground app
        run: python3 Scripts/location_probe.py '${{ matrix.ios }}' '${{ matrix.distance_filter }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gps-control-${{ matrix.ios }}-filter-${{ matrix.distance_filter }}
          path: |
            build/compatibility/control-*.json
