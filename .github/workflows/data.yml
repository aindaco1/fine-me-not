name: Camera database and website
on:
  schedule:
    - cron: '0 0 * * 1'
      timezone: America/Denver
  workflow_dispatch:
    inputs:
      refresh_sources:
        description: Fetch upstream camera data before publishing
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['Site/**', 'Data/**', 'Scripts/*cameras.py', 'Scripts/stage_site.py', '.github/workflows/data.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: camera-database-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test publisher
        run: python3 -m unittest discover -s Tests/Pipeline -v
      - name: Refresh upstream cameras
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_sources)
        run: python3 Scripts/publish_cameras.py --fetch
      - name: Publish reviewed inputs
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.refresh_sources)
        run: python3 Scripts/publish_cameras.py
      - name: Save reproducible source and snapshot changes
        run: |
          git config user.name 'fine-me-not publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Data
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh camera database'
            git push
          fi
      - name: Stage website and immutable snapshots
        run: python3 Scripts/stage_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: work/site
      - name: Deploy website and database
        id: deployment
        uses: actions/deploy-pages@v4
